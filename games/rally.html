}
function hitBy(e) {
  e.hit = true; car.hearts--; car.inv = 1.5; car.v *= e.type === "pothole" ? 0.7 : 0.45; shake = 0.7; car.wobble = 1;
  if (e.type === "sheep") { PA.sfx("hit"); setTimeout(() => { PA.sfx("cluck"); PA.sfx("moo"); }, 110); toast("Baa! Sorry, sheep!"); e.fly = 1; }
  else if (e.type === "pothole") { PA.sfx("thud"); PA.sfx("bounce"); car.bump = 1; toast("Pothole!"); }
  else { PA.sfx("hit"); PA.sfx("thud"); toast(e.type === "tractor" ? "Bumped the tractor!" : "Hay everywhere!"); if (e.type === "bale") e.fly = 1; }
  if (car.hearts <= 0) { state = "crashing"; car.crashT = 0; PA.sfx("fail"); }
}
function respawnFirefly(f, initial) {
  f.s = car.s + (initial ? rand(-20, 150) : rand(90, 160)); f.d = (Math.random() < 0.5 ? -1 : 1) * rand(4.5, 38); f.y = rand(0.4, 2.8);
}
function step(dt) {
  const play = state === "play", crashing = state === "crashing";
  let steerIn = 0, gas = false, brake = false;
  if (play && AUTO) ({ steer: steerIn, gas, brake } = autopilot());
  else if (play) {
    const k = PA.keys;
    steerIn = (k.has("ArrowRight") || k.has("KeyD") ? 1 : 0) - (k.has("ArrowLeft") || k.has("KeyA") ? 1 : 0) || clamp(PA.axis.x * 1.15, -1, 1);
    brake = k.has("ArrowDown") || k.has("KeyS") || PA.axis.y > 0.55;
    gas = k.has("ArrowUp") || k.has("KeyW") || (PA.TOUCH && !brake);
  }
  car.steer += (steerIn - car.steer) * Math.min(1, dt * (steerIn === 0 ? 6 : 4));
  // road-relative coordinates (advance the nearest-sample pointer)
  const offroad = Math.abs(car.d) > HW + 0.4;
  const baseMax = 30 + (mode === "endless" ? diff() * 9 : 0), maxV = (offroad ? 18 : baseMax) + (car.boostT > 0 ? 15 : 0);
  if (crashing) car.v *= Math.exp(-dt * 2.2);
  else if (gas) car.v += (car.v < maxV ? (car.boostT > 0 ? 18 : 10) * (1 - car.v / (maxV + 12)) * 1.6 : -8) * dt;
  else car.v -= 4 * dt;
  if (brake) car.v -= 24 * dt;
  car.v = Math.max(0, car.v);
  car.boostT = Math.max(0, car.boostT - dt);
  const yaw = car.steer * 1.25 * Math.min(1, car.v / 9) * (1 - Math.min(0.3, car.v / 140));
  car.psi += yaw * dt;
  car.x += Math.sin(car.psi) * car.v * dt; car.z -= Math.cos(car.psi) * car.v * dt;
  for (let n = 0; n < 6; n++) {   // move pointer forward/back to the segment containing the truck
    const i = idx(car.tk), j = idx(car.tk + 1);
    if ((car.x - PX[j]) * Math.sin(TH[j]) - (car.z - PZ[j]) * Math.cos(TH[j]) >= 0) car.tk++;
    else if ((car.x - PX[i]) * Math.sin(TH[i]) - (car.z - PZ[i]) * Math.cos(TH[i]) < 0 && car.tk > kHead - N + 2) car.tk--;
    else break;
  }
  const i = idx(car.tk), c = Math.cos(TH[i]), s = Math.sin(TH[i]);
  const along = (car.x - PX[i]) * s - (car.z - PZ[i]) * c;
  car.d = (car.x - PX[i]) * c + (car.z - PZ[i]) * s; car.s = car.tk * SP + along;
  const th = TH[i];
  // fence / soft barrier
  fenceCD -= dt;
  if (Math.abs(car.d) > LIMIT) {
    const over = car.d - Math.sign(car.d) * LIMIT; car.x -= c * over; car.z -= s * over; car.d -= over;
    car.psi = th + (car.psi - th) * -0.35; car.v *= 0.82; shake = Math.max(shake, 0.25);
    if (fenceCD <= 0) { PA.sfx("thud"); fenceCD = 0.6; if (play) toast("Easy on the fence!", 900); }
  }
  car.psi = th + clamp(car.psi - th, -1.1, 1.1);   // never turn around
  streamRoad();
  // obstacles, pickups
  for (let n = ents.length - 1; n >= 0; n--) {
    const e = ents[n]; e.t += dt;
    if (e.s < car.s - 30 || e.done) { pools[e.type].put(e.obj); ents.splice(n, 1); continue; }
    if (e.type === "sheep" && !e.fly) { e.d += e.vd * dt; if (Math.abs(e.d) > 7) e.vd = -Math.sign(e.d) * Math.abs(e.vd); }
    if (e.type === "tractor") e.s += e.vs * dt;
    placeEnt(e);
    const o = e.obj;
    if (e.type === "jar") { o.position.y = 0.9 + Math.sin(e.t * 2.5) * 0.15; o.rotation.y += dt; o.userData.glow.scale.setScalar(0.85 + Math.sin(e.t * 9) * 0.15); }
    else if (e.type === "sheep" && !e.fly) { o.userData.legs.forEach((l, q) => (l.rotation.x = Math.sin(e.t * 10 + q * Math.PI) * 0.5)); o.userData.body.position.y = 0.95 + Math.abs(Math.sin(e.t * 10)) * 0.05; }
    else if (e.type === "tractor") { o.userData.beacon.material.opacity = 0.4 + 0.6 * Math.max(0, Math.sin(e.t * 8)); o.userData.wheels.forEach((w) => (w.rotation.x -= e.vs * dt)); }
    if (e.fly) { e.fly += dt; o.position.y = Math.max(0, Math.sin(Math.min(e.fly, 1.2) * 2.6) * 2.5); o.rotation.z += dt * 6; if (e.fly > 1.3) e.done = true; continue; }
    const ds = e.s - car.s, dd = e.d - car.d;
    if (e.type === "jar") { if (Math.abs(ds) < 2.3 && Math.abs(dd) < 1.3 && play) { e.done = true; jars++; car.boost = Math.min(1, car.boost + 0.12); PA.sfx("coin"); if (car.boost >= 1 && car.boostT <= 0) toast(PA.TOUCH ? "Boost ready! Tap Boost" : "Boost ready! Press Space", 1200); } continue; }
    if (!e.hit && play && car.inv <= 0 && !PA.THUMB && Math.abs(ds) < 2.15 + e.hs && Math.abs(dd) < 0.95 + e.hd) hitBy(e);
    if (!e.passed && ds < -(2.2 + e.hs)) {
      e.passed = true;
      if (!e.hit && play && Math.abs(dd) < 0.95 + e.hd + 1.4 && e.type !== "pothole") { car.boost = Math.min(1, car.boost + 0.22); PA.sfx("whoosh"); toast("Near miss! +boost", 800); }
    }
  }
  for (let n = houses.length - 1; n >= 0; n--) if (houses[n].userData.s < car.s - 60) { housePool.put(houses[n]); houses.splice(n, 1); }
  // timers & game flow
  car.inv = Math.max(0, car.inv - dt); car.wobble = Math.max(0, car.wobble - dt * 1.4); car.bump = Math.max(0, car.bump - dt * 3);
  if (play) {
    time += dt;
    if (mode === "sprint" && dist() >= GOAL) { endRun(true); }
  }
  if (crashing) { car.crashT += dt; car.spin += dt * 7 * Math.max(0, 1 - car.crashT / 1.4); if (car.crashT > 1.4) endRun(false); }
  return { offroad, th };
}

/* ------------------------------------------------------------ visuals per frame */
function updateParticles(dt, offroad) {
  // fireflies drift and blink around the road ahead
  for (let i = 0; i < FF.n; i++) {
    const f = ffData[i]; f.ph += dt;
    if (f.s < car.s - 25 || f.s > car.s + 170) respawnFirefly(f, false);
    worldAt(f.s, f.d + Math.sin(f.ph * 0.7) * 1.2, _v);
    FF.P.set([_v.x + Math.sin(f.ph * 1.3) * 0.6, f.y + Math.sin(f.ph * 0.9) * 0.4, _v.z + Math.cos(f.ph * 1.1) * 0.6], i * 3);
    FF.S[i] = 0.32; FF.A[i] = 0.25 + 0.75 * Math.pow(Math.max(0, Math.sin(f.ph * 2.2 + i)), 3);
  }
  FF.g.attributes.position.needsUpdate = FF.g.attributes.alpha.needsUpdate = FF.g.attributes.size.needsUpdate = true;
  // dust from the rear wheels
  const rate = (car.v > 3 ? car.v * 0.5 : 0) * (offroad ? 3 : 1) * (car.boostT > 0 ? 2.5 : 1) * (state === "play" || state === "crashing" ? 1 : 0);
  let emit = rate * dt + (Math.random() < (rate * dt) % 1 ? 1 : 0);
  while (emit-- >= 1) {
    const p = duData[duI], i = duI; duI = (duI + 1) % DU.n;
    const side = Math.random() < 0.5 ? -1 : 1, lx = side * 0.95, lz = 1.6;
    DU.P.set([car.x + Math.cos(car.psi) * lx - Math.sin(car.psi) * lz, 0.25, car.z + Math.sin(car.psi) * lx + Math.cos(car.psi) * lz], i * 3);
    p.vx = rand(-1, 1) + Math.sin(car.psi) * car.v * 0.15; p.vy = rand(0.6, 1.8); p.vz = rand(-1, 1) - Math.cos(car.psi) * car.v * 0.15; p.life = p.max = rand(0.6, 1.2);
    DU.C.set(offroad ? [0.5, 0.42, 0.38] : [0.42, 0.4, 0.5], i * 3);
  }
  for (let i = 0; i < DU.n; i++) {
    const p = duData[i];
    if (p.life <= 0) { DU.A[i] = 0; continue; }
    p.life -= dt; const k = p.life / p.max;
    DU.P[i * 3] += p.vx * dt; DU.P[i * 3 + 1] += p.vy * dt; DU.P[i * 3 + 2] += p.vz * dt; p.vy *= 0.97;
    DU.S[i] = 0.25 + (1 - k) * 0.9; DU.A[i] = 0.28 * k;
  }
  DU.g.attributes.position.needsUpdate = DU.g.attributes.alpha.needsUpdate = DU.g.attributes.size.needsUpdate = DU.g.attributes.color.needsUpdate = true;
}

let fovBase = 62;
PA.onResize(() => {
  const a = innerWidth / innerHeight;
  camera.aspect = a; fovBase = a < 0.8 ? 78 : a < 1.2 ? 68 : 60; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); paintBackdrop();
  const h = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(THREE.MathUtils.degToRad(fovBase) / 2));
  FF.pts.material.uniforms.uH.value = DU.pts.material.uniforms.uH.value = h;
});

function tick(dt, t) {
  const running = (state === "play" || state === "crashing") && !PA.overlayOpen();
  const sdt = running ? dt : 0;
  const { offroad } = step(sdt);
  // truck pose
  const slip = car.steer * Math.min(1, car.v / 25) * (car.boostT > 0 ? 0.42 : 0.12);
  truck.root.position.set(car.x, 0, car.z); truck.root.rotation.y = -(car.psi + slip + car.spin);
  const rough = offroad && car.v > 2 ? (Math.random() - 0.5) * 0.05 : 0;
  truck.body.rotation.z = -car.steer * Math.min(1, car.v / 30) * 0.06 + Math.sin(t * 30) * car.wobble * 0.12 + rough;
  truck.body.rotation.x = (car.boostT > 0 ? -0.04 : 0) + rough + Math.sin(car.bump * Math.PI) * 0.12;
  truck.body.position.y = Math.sin(car.bump * Math.PI) * 0.4 + Math.abs(Math.sin(t * 13)) * 0.015 * Math.min(1, car.v / 10);
  truck.wheels.forEach((w) => (w.rotation.x -= car.v * sdt / 0.43));
  truck.steerers.forEach((p) => (p.rotation.y = -car.steer * 0.45));
  truck.body.visible = car.inv <= 0 || Math.floor(t * 12) % 2 === 0 || state !== "play";
  updateParticles(sdt, offroad);
  // camera: lagging chase, FOV kick on boost, shake on hits
  const a = camera.aspect, back = a < 0.8 ? 9.5 : 7.6, up = a < 0.8 ? 4.3 : 3.3;
  fwd.set(Math.sin(car.psi), 0, -Math.cos(car.psi));
  // offset (not position) is smoothed, so the chase lags on turns but never drifts away at speed
  const pull = back + car.v * 0.03 + (car.boostT > 0 ? 1.2 : 0);
  camPos.set(-fwd.x * pull, up, -fwd.z * pull);
  camOff.lerp(camPos, 1 - Math.exp(-dt * 3.2));
  camera.position.set(car.x + camOff.x, camOff.y, car.z + camOff.z);
  shake = Math.max(0, shake - dt * 1.6);
  const sh = PA.REDUCED ? shake * 0.3 : shake;
  camera.position.x += (Math.random() - 0.5) * sh * 0.6; camera.position.y += (Math.random() - 0.5) * sh * 0.6;
  camLook.set(car.x + fwd.x * 7, 1.3, car.z + fwd.z * 7); camera.lookAt(camLook);
  const fovT = fovBase + (car.boostT > 0 ? 14 : 0) + Math.min(6, car.v / 6);
  camera.fov += (fovT - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix();
  skyRig.position.copy(camera.position);
  moon.position.set(car.x - 30, 60, car.z - 40); moon.target.position.set(car.x, 0, car.z - 8);
  ground.position.set(Math.round(car.x / (FIELD * 2)) * FIELD * 2, 0, Math.round(car.z / (FIELD * 2)) * FIELD * 2);
  truck.spots.forEach((L) => (L.intensity = car.boostT > 0 ? 160 : 120));
  if (running) updateHUD(false);
}

/* ------------------------------------------------------------ boot */
resetWorld();
// warm up shader variants for pooled objects (hidden until spawned)
{ const hidden = []; scene.traverse((o) => { if (!o.visible) { hidden.push(o); o.visible = true; } }); tick(0, 0); renderer.render(scene, camera); hidden.forEach((o) => (o.visible = false)); }
if (PA.THUMB) {
  state = "play";
  for (let i = 0; i < 150; i++) tick(1 / 60, i / 60);       // drive into the first bend
  // stage a lively stretch just ahead of the headlights
  for (let i = 0; i < 6; i++) spawn("jar", car.s + 9 + i * 3.2, -1.2 + Math.sin(i * 0.8) * 1.2);
  spawn("sheep", car.s + 34, 2.4, { vd: -1.4 }); spawn("sheep", car.s + 38, 4.2, { vd: -1.2 });
  spawn("bale", car.s + 50, -2.4); spawn("tractor", car.s + 70, 2.3, { vs: 8 });
  car.boostT = 2.6; for (let i = 0; i < 20; i++) tick(1 / 60, 3 + i / 60);
} else startOverlay();

let frames = 0; const realStart = performance.now();
PA.loop((dt, t) => {
  dt = Math.max(0, dt);   // rAF timestamps can precede the loop's start → never step backwards
  tick(PA.THUMB ? 0 : dt, t);
  renderer.render(scene, camera);
  if (PA.THUMB && !window.__ready && ++frames > 3 && performance.now() - realStart > 2000) window.__ready = true;
});
</script></body></html>
