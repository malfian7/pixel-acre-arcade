<script type="module">
import * as THREE from "three";
import { PA } from "./common.js";

/* ------------------------------------------------------------ constants */
const V3 = THREE.Vector3;
const HL = 1.37, HW = 0.7625, TOP = 0.76, NET = 0.1525; // table half-length, half-width, height, net height
const R = 0.034;                  // ball radius (arcade-sized)
const G = 6.6;                    // softened gravity for readable rallies
const ZP = 1.62, ZC = -1.62;      // player / CPU paddle planes
const WIN = 5;
const KS = 1.0, KT = 1.3;         // spin -> acceleration
const DIFF = {
  easy:   { label: "Easy",   T: 1.05, cpuSpeed: 1.7, react: 0.32, err: 0.2,  noise: 0.11, hitR: 0.36, cpuR: 0.2,  guide: true },
  normal: { label: "Normal", T: 0.9,  cpuSpeed: 2.5, react: 0.2,  err: 0.11, noise: 0.05, hitR: 0.3,  cpuR: 0.22, guide: true },
  hard:   { label: "Hard",   T: 0.76, cpuSpeed: 3.4, react: 0.12, err: 0.05, noise: 0.025, hitR: 0.26, cpuR: 0.24, guide: false },
};
const LINES = {
  cpuScores: [["やった！", "Yes!"], ["どうだ！", "How's that!"], ["いいね！", "Nice one!"]],
  cpuLoses:  [["くそー！", "Oh no!"], ["うわっ！", "Whoa!"], ["やるね！", "You're good!"]],
};
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = THREE.MathUtils.clamp;
const pick = (a) => a[(Math.random() * a.length) | 0];

/* ------------------------------------------------------------ renderer + scene */
const renderer = await PA.renderer(THREE, { clear: 0x2a2147 });
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9a6478, 16, 95);
const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.05, 400);
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.85, metalness: 0, ...o });
function add(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
// value noise for terrain
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

/* ---- sky dome with sunset gradient (vertex colors) ---- */
const sunDir = new V3(0.62, 0.17, -0.77).normalize();
{
  const g = new THREE.SphereGeometry(200, 40, 20), pos = g.attributes.position;
  const stops = [[-0.3, "#3a2f5e"], [0, "#ffb36e"], [0.07, "#ff9a78"], [0.2, "#f27c8c"], [0.42, "#7b4f95"], [1, "#2a2147"]].map(([t, c]) => [t, new THREE.Color(c)]);
  const sunC = new THREE.Color("#ffe0a0"), c = new THREE.Color(), p = new V3(), cols = [];
  for (let i = 0; i < pos.count; i++) {
    p.fromBufferAttribute(pos, i).normalize();
    let k = 0; while (k < stops.length - 2 && p.y > stops[k + 1][0]) k++;
    const [t0, c0] = stops[k], [t1, c1] = stops[k + 1];
    c.copy(c0).lerp(c1, clamp((p.y - t0) / (t1 - t0), 0, 1));
    c.lerp(sunC, Math.pow(Math.max(0, p.dot(sunDir)), 10) * 0.85);
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })));
  const sun = new THREE.Mesh(new THREE.CircleGeometry(9, 32), new THREE.MeshBasicMaterial({ color: 0xfff0c4, fog: false }));
  sun.position.copy(sunDir).multiplyScalar(185); sun.lookAt(0, 0, 0); scene.add(sun);
}

/* ---- canvas textures ---- */
function glowTex() {
  const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d");
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "rgba(255,230,170,1)"); gr.addColorStop(0.3, "rgba(255,190,110,.45)"); gr.addColorStop(1, "rgba(255,160,80,0)");
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function netTex() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 64; const x = c.getContext("2d");
  x.strokeStyle = "rgba(240,240,250,.85)"; x.lineWidth = 2;
  for (let i = 0; i <= 512; i += 10) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 64); x.stroke(); }
  for (let j = 0; j <= 64; j += 10) { x.beginPath(); x.moveTo(0, j); x.lineTo(512, j); x.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTex();

/* ---- lights ---- */
scene.add(new THREE.HemisphereLight(0xb9a6ff, 0x5a3a2a, 1.0));
const sunLight = new THREE.DirectionalLight(0xffb36b, 2.8);
sunLight.position.copy(sunDir).multiplyScalar(12); sunLight.castShadow = true;
Object.assign(sunLight.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
sunLight.shadow.mapSize.set(2048, 2048); sunLight.shadow.bias = -0.0004; sunLight.shadow.normalBias = 0.02;
scene.add(sunLight);
for (const [x, z] of [[-1.4, -1.3], [1.4, 1.4]]) { const l = new THREE.PointLight(0xffc27a, 2.2, 7, 1.6); l.position.set(x, 2.3, z); scene.add(l); }

/* ---- far landscape: rolling fields & hills ---- */
{
  const g = new THREE.PlaneGeometry(260, 260, 70, 70).toNonIndexed(); g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, cols = [], c = new THREE.Color();
  const field = ["#c9a14a", "#8fae4c", "#6f9a4a", "#d7b65e", "#a0794a", "#7fa864"].map((h) => new THREE.Color(h));
  const H = (x, z) => { const d = Math.hypot(x, z); const k = THREE.MathUtils.smoothstep(d, 10, 90); return -0.5 + k * (vnoise(x * 0.04, z * 0.04) * 14 + vnoise(x * 0.12, z * 0.12) * 3); };
  for (let i = 0; i < pos.count; i++) pos.setY(i, H(pos.getX(i), pos.getZ(i)));
  for (let i = 0; i < pos.count; i += 3) {
    const cx = (pos.getX(i) + pos.getX(i + 1) + pos.getX(i + 2)) / 3, cz = (pos.getZ(i) + pos.getZ(i + 1) + pos.getZ(i + 2)) / 3;
    const cy = (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3;
    c.copy(field[Math.floor(hash(Math.floor(cx / 11), Math.floor(cz / 8)) * field.length)]);
    if (cy > 7) c.lerp(new THREE.Color("#5d7a52"), 0.6);
    c.offsetHSL(0, 0, (hash(cx, cz) - 0.5) * 0.04);
    for (let k = 0; k < 3; k++) cols.push(c.r, c.g, c.b);
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3)); g.computeVertexNormals();
  const ground = new THREE.Mesh(g, std(0xffffff, { vertexColors: true })); ground.receiveShadow = true; scene.add(ground);
  // trees dotted on the hills
  const tree = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 2.6, 6), std(0xffffff), 70);
  const m = new THREE.Matrix4(), tc = new THREE.Color();
  for (let i = 0; i < 70; i++) {
    const a = rand(-2.6, -0.5) + (i % 2 ? Math.PI : 0) * 0, d = rand(16, 70);
    const x = Math.cos(a) * d * 1.4, z = Math.sin(a) * d, s = rand(0.7, 1.6);
    m.makeScale(s, s * rand(0.9, 1.4), s).setPosition(x, H(x, z) + 1.2 * s, z); tree.setMatrixAt(i, m);
    tree.setColorAt(i, tc.set(pick(["#5a8a5e", "#6b9656", "#4f7a5c", "#7a9a58"])));
  }
  tree.castShadow = true; scene.add(tree);
}

/* ---- porch deck, barn, fence, hay ---- */
{
  // planks
  const planks = new THREE.InstancedMesh(new THREE.BoxGeometry(0.19, 0.12, 1), std(0xffffff, { roughness: 0.95 }), 260);
  const m = new THREE.Matrix4(), c = new THREE.Color(); let n = 0;
  for (let x = -3.2; x < 3.45 && n < 260; x += 0.2) {
    let z = -4.3 + rand(-0.8, 0);
    while (z < 4.3 && n < 260) {
      const len = Math.min(rand(1.4, 2.8), 4.3 - z); if (len < 0.2) break;
      m.makeScale(1, 1, len - 0.02).setPosition(x, -0.06, z + len / 2); planks.setMatrixAt(n, m);
      planks.setColorAt(n++, c.set(pick(["#8a5a3c", "#9c6a45", "#7d4f35", "#a57450"])));
      z += len;
    }
  }
  planks.count = n; planks.receiveShadow = true; scene.add(planks);
  add(new THREE.BoxGeometry(6.8, 0.4, 8.8), std(0x5e3b2c), 0.12, -0.32, 0); // deck skirt

  // barn on the left
  const red = std(0xb5473f), white = std(0xf1e6d6), roof = std(0x4d3550);
  add(new THREE.BoxGeometry(5, 4.2, 10), red, -5.75, 2.0, -0.6);
  const sh = new THREE.Shape(); sh.moveTo(-2.9, 0); sh.lineTo(0, 2.3); sh.lineTo(2.9, 0); sh.lineTo(-2.9, 0);
  const rg = new THREE.ExtrudeGeometry(sh, { depth: 10.6, bevelEnabled: false }); rg.translate(0, 0, -5.3);
  add(rg, roof, -5.75, 4.1, -0.6);
  add(new THREE.BoxGeometry(0.08, 3.1, 2.6), std(0x6e2a2c), -3.24, 1.55, -0.6, scene, false); // door
  for (const s of [1, -1]) { const b = add(new THREE.BoxGeometry(0.1, 3.9, 0.14), white, -3.2, 1.55, -0.6, scene, false); b.rotation.x = s * 0.68; }
  for (const z of [-1.9, 0.7]) add(new THREE.BoxGeometry(0.1, 3.1, 0.14), white, -3.2, 1.55, z, scene, false);
  add(new THREE.BoxGeometry(0.1, 0.14, 2.74), white, -3.2, 3.1, -0.6, scene, false);
  const lantern = add(new THREE.BoxGeometry(0.16, 0.24, 0.16), new THREE.MeshBasicMaterial({ color: 0xffd38a }), -3.12, 2.6, 1.4, scene, false);
  const ll = new THREE.PointLight(0xffb867, 1.6, 5, 1.5); ll.position.copy(lantern.position).add(new V3(0.4, 0, 0)); scene.add(ll);

  // posts, rails and fence on the open sides
  const wood = std(0x6b4630), rail = std(0x8a6040);
  const posts = [[3.3, -4.1], [3.3, -1.4], [3.3, 1.4], [3.3, 4.1], [-3.0, -4.1], [-3.0, 4.1]];
  for (const [x, z] of posts) add(new THREE.BoxGeometry(0.14, 2.9, 0.14), wood, x, 1.4, z);
  for (const y of [0.45, 0.9]) {
    add(new THREE.BoxGeometry(0.07, 0.09, 8.2), rail, 3.3, y, 0);
    add(new THREE.BoxGeometry(6.3, 0.09, 0.07), rail, 0.15, y, -4.1);
  }
  for (let x = -2.8; x < 3.3; x += 0.45) add(new THREE.BoxGeometry(0.08, 1.05, 0.05), rail, x, 0.5, -4.12);
  for (let z = -3.8; z < 4.1; z += 0.45) add(new THREE.BoxGeometry(0.05, 1.05, 0.08), rail, 3.32, 0.5, z);
  add(new THREE.BoxGeometry(0.12, 0.12, 8.4), wood, 3.3, 2.82, 0); // top beam
  add(new THREE.BoxGeometry(6.4, 0.12, 0.12), wood, 0.15, 2.82, -4.1);

  // hay bales (round + square) and pumpkins
  const hay = std(0xe0b456, { roughness: 1 }), hay2 = std(0xc99a3e, { roughness: 1 });
  for (const [x, z, r] of [[-2.4, -3.4, 0.2], [-1.4, -3.55, -0.3], [2.6, 3.4, 1.2]]) {
    const b = add(new THREE.CylinderGeometry(0.55, 0.55, 0.9, 10), hay, x, 0.55, z); b.rotation.set(0, r, Math.PI / 2);
    add(new THREE.CylinderGeometry(0.4, 0.4, 0.92, 10), hay2, 0, 0, 0, b, false);
  }
  for (const [x, y, z, r] of [[2.5, 0.25, -3.4, 0.1], [2.5, 0.25, -2.6, -0.05], [2.5, 0.75, -3.0, 0.2], [-2.55, 0.25, 2.4, 1.5]])
    { const b = add(new THREE.BoxGeometry(0.9, 0.5, 0.6), hay, x, y, z); b.rotation.y = r; }
  for (const [x, z, s] of [[-2.6, 3.4, 0.28], [-2.15, 3.6, 0.2], [1.9, -3.6, 0.24]]) {
    const p = add(new THREE.SphereGeometry(s, 10, 7), std(0xe8742c), x, s * 0.8, z); p.scale.y = 0.75;
    add(new THREE.CylinderGeometry(0.03, 0.04, 0.12, 5), std(0x4c6b34), 0, s * 0.95, 0, p, false);
  }
}

/* ---- string lights: catenary strands with glowing bulbs ---- */
{
  const strands = [
    [[3.3, 2.8, -4.1], [-3.0, 2.8, -4.1], 0.35], [[3.3, 2.8, -4.1], [-3.0, 2.8, 4.1], 0.6],
    [[-3.0, 2.8, -4.1], [3.3, 2.8, 1.4], 0.55], [[3.3, 2.8, -4.1], [3.3, 2.8, 4.1], 0.4],
    [[-3.0, 2.8, -4.1], [-3.0, 2.8, 4.1], 0.4],
  ];
  const bulbs = [], wire = new THREE.LineBasicMaterial({ color: 0x2b2030 });
  for (const [a, b, sag] of strands) {
    const A = new V3(...a), B = new V3(...b), pts = [];
    for (let i = 0; i <= 30; i++) { const t = i / 30, p = A.clone().lerp(B, t); p.y -= sag * 4 * t * (1 - t); pts.push(p); if (i % 2 && i < 30) bulbs.push(p.clone().add(new V3(0, -0.05, 0))); }
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wire));
  }
  const im = new THREE.InstancedMesh(new THREE.SphereGeometry(0.04, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }), bulbs.length);
  const m = new THREE.Matrix4(), c = new THREE.Color();
  bulbs.forEach((p, i) => { im.setMatrixAt(i, m.makeTranslation(p.x, p.y, p.z)); im.setColorAt(i, c.set(pick(["#ffe2a0", "#ffd07a", "#ffc7a6"]))); });
  scene.add(im);
  const pg = new THREE.BufferGeometry().setFromPoints(bulbs);
  scene.add(new THREE.Points(pg, new THREE.PointsMaterial({ map: GLOW, size: 0.45, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffd9a0 })));
}

/* ---- table ---- */
{
  const top = std(0x2c6a72, { roughness: 0.55 }), line = std(0xf4f0e8, { roughness: 0.6 }), dark = std(0x2a2232);
  add(new THREE.BoxGeometry(HW * 2, 0.04, HL * 2), top, 0, TOP - 0.02, 0);
  for (const s of [-1, 1]) {
    add(new THREE.BoxGeometry(0.02, 0.003, HL * 2), line, s * (HW - 0.01), TOP + 0.001, 0, scene, false);
    add(new THREE.BoxGeometry(HW * 2, 0.003, 0.02), line, 0, TOP + 0.001, s * (HL - 0.01), scene, false);
  }
  add(new THREE.BoxGeometry(0.006, 0.003, HL * 2), line, 0, TOP + 0.001, 0, scene, false);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) add(new THREE.BoxGeometry(0.06, TOP - 0.04, 0.06), dark, sx * (HW - 0.12), (TOP - 0.04) / 2, sz * (HL - 0.25));
  add(new THREE.BoxGeometry(HW * 1.7, 0.05, 0.05), dark, 0, 0.3, 0);
  // net
  const net = add(new THREE.PlaneGeometry(HW * 2 + 0.3, NET), new THREE.MeshBasicMaterial({ map: netTex(), transparent: true, side: THREE.DoubleSide, depthWrite: false, color: 0xdddde8 }), 0, TOP + NET / 2, 0, scene, false);
  net.renderOrder = 2;
  add(new THREE.BoxGeometry(HW * 2 + 0.3, 0.018, 0.012), line, 0, TOP + NET, 0, scene, false);
  for (const s of [-1, 1]) add(new THREE.CylinderGeometry(0.012, 0.012, NET + 0.03, 6), dark, s * (HW + 0.15), TOP + NET / 2, 0);
}

/* ---- paddles, ball, helpers ---- */
function makePaddle(color) {
  const g = new THREE.Group();
  const blade = add(new THREE.CylinderGeometry(0.16, 0.16, 0.024, 28), std(color, { roughness: 0.6 }), 0, 0, 0, g);
  blade.rotation.x = Math.PI / 2;
  const rim = add(new THREE.TorusGeometry(0.16, 0.012, 6, 28), std(0x6b4630), 0, 0, 0, g); rim.rotation.y = 0;
  add(new THREE.BoxGeometry(0.05, 0.15, 0.035), std(0x9c6a45), 0, -0.22, 0, g);
  scene.add(g); return g;
}
const pPad = makePaddle(0xe2504a), cPad = makePaddle(0x4fa3c7);
pPad.traverse((o) => { if (o.material) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 0.72; o.material.emissive = new THREE.Color(0x40201c); } });
const ballMesh = add(new THREE.SphereGeometry(R, 16, 12), new THREE.MeshStandardMaterial({ color: 0xfff4e0, emissive: 0xffb36b, emissiveIntensity: 0.35, roughness: 0.4 }));
const shadowMat = new THREE.MeshBasicMaterial({ color: 0x120c1e, transparent: true, opacity: 0.4, depthWrite: false });
const ballShadow = add(new THREE.CircleGeometry(R * 1.3, 20), shadowMat, 0, 0, 0, scene, false);
ballShadow.rotation.x = -Math.PI / 2; ballShadow.renderOrder = 1;
const trail = Array.from({ length: 7 }, (_, i) => { const m = add(new THREE.SphereGeometry(R * (0.85 - i * 0.09), 8, 6), new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.32 - i * 0.04, depthWrite: false }), 0, 0, 0, scene, false); return m; });
const trailPts = [];
const guide = add(new THREE.RingGeometry(0.075, 0.1, 28), new THREE.MeshBasicMaterial({ color: 0xf4a63a, transparent: true, opacity: 0.75, depthTest: false }), 0, 0, ZP, scene, false);
guide.renderOrder = 5; guide.visible = false;

/* ---- Patch the scarecrow (CPU) ---- */
const patch = (() => {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body); scene.add(root);
  const burlap = std(0xc9a26b), straw = std(0xe8c35a), denim = std(0x4a5f9e), ink = std(0x2a1606);
  add(new THREE.CylinderGeometry(0.04, 0.05, 0.9, 6), std(0x6b4630), 0, 0.45, 0, root); // pole
  const torso = add(new THREE.SphereGeometry(0.33, 12, 9), burlap, 0, 1.1, 0, body); torso.scale.set(1, 1.08, 0.9);
  const pants = add(new THREE.SphereGeometry(0.34, 12, 9, 0, Math.PI * 2, Math.PI * 0.52, Math.PI * 0.48), denim, 0, 1.1, 0, body); pants.scale.set(1, 1.08, 0.92);
  add(new THREE.BoxGeometry(0.16, 0.14, 0.04), std(0xf27c8c), 0.1, 1.02, 0.3, body).rotation.z = 0.2; // patch
  for (const s of [-1, 1]) add(new THREE.BoxGeometry(0.05, 0.36, 0.03), denim, s * 0.14, 1.18, 0.27, body).rotation.x = -0.35;
  const head = new THREE.Group(); head.position.set(0, 1.56, 0); body.add(head);
  add(new THREE.SphereGeometry(0.2, 12, 9), std(0xe3c38c), 0, 0, 0, head);
  const eyes = [];
  for (const s of [-1, 1]) {
    const e = add(new THREE.CylinderGeometry(0.035, 0.035, 0.02, 10), ink, s * 0.075, 0.03, 0.185, head, false); e.rotation.x = Math.PI / 2; eyes.push(e);
    add(new THREE.SphereGeometry(0.03, 8, 6), std(0xf27c8c), s * 0.12, -0.04, 0.165, head, false);
  }
  const mouth = add(new THREE.TorusGeometry(0.07, 0.008, 4, 12, Math.PI), ink, 0, -0.03, 0.18, head, false); mouth.rotation.z = Math.PI;
  const hat = new THREE.Group(); hat.position.set(0, 0.13, 0); head.add(hat);
  add(new THREE.CylinderGeometry(0.38, 0.4, 0.03, 14), straw, 0, 0, 0, hat);
  add(new THREE.CylinderGeometry(0.15, 0.2, 0.2, 10), straw, 0, 0.11, 0, hat);
  add(new THREE.CylinderGeometry(0.205, 0.205, 0.045, 10), std(0xf27c8c), 0, 0.04, 0, hat, false);
  for (let i = 0; i < 7; i++) { const a = (i / 7) * Math.PI * 2; const t = add(new THREE.ConeGeometry(0.03, 0.14, 4), straw, Math.cos(a) * 0.22, 0.3, Math.sin(a) * 0.2, body, false); t.rotation.set(Math.sin(a) * 1.2, 0, -Math.cos(a) * 1.2); }
  const armMat = burlap;

/* ------------------------------------------------------------ update */

function update(dt, t) {

function simulate(dt, t) {

    const ky = (PA.keys.has("ArrowUp") || PA.keys.has("KeyW") ? 1 : 0) - (PA.keys.has("ArrowDown") || PA.keys.has("KeyS") ? 1 : 0);

    P.head.rotation.x = P.mood < 0 ? 0.35 : 0;

    const blink = (t % 3.3) < 0.12 ? 0.15 : 1; P.eyes.forEach((e) => (e.scale.z = blink));
    // stretch his arm from shoulder to paddle handle
    const sh = new V3(-0.28, 1.22, 0).applyMatrix4(P.body.matrixWorld), hd = cPad.position.clone().add(new V3(0, -0.2, 0));
    const dir = hd.clone().sub(sh), len = dir.length();

}

  const overTable = Math.abs(ball.p.x) < HW && Math.abs(ball.p.z) < HL;
  const gy = overTable ? TOP + 0.003 : 0.005, hgt = Math.max(0, ball.p.y - gy);
  ballShadow.position.set(ball.p.x, gy, ball.p.z); ballShadow.scale.setScalar(1 + hgt * 0.8);
  shadowMat.opacity = clamp(0.5 - hgt * 0.25, 0.12, 0.5);
  if (dt > 0) { trailPts.unshift(ball.p.clone()); if (trailPts.length > 14) trailPts.pop(); }
  trail.forEach((m, i) => { const p = trailPts[i * 2 + 1]; m.visible = !!p && S.phase !== "serve"; if (p) m.position.copy(p); });
  const g = S.phase === "rally" && S.hitter === "C" && d.guide && S.guideAt && S.guideAt.bounced >= 1 && !PA.THUMB;
  guide.visible = !!g;
  if (g) { guide.position.set(S.guideAt.x, S.guideAt.y, ZP); guide.scale.setScalar(1 + Math.sin(t * 10) * 0.08); }
  const k2 = 0.25 + camBase.k * 0.4;
  camera.position.x += (pPad.position.x * k2 - camera.position.x) * Math.min(1, (dt || 0.016) * 3);
  camera.position.y = camBase.y; camera.position.z = camBase.z;
  camera.lookAt(camera.position.x * 0.4, 0.9 + camBase.k * 0.12, -0.9 - camBase.k * 0.3);
  renderer.render(scene, camera);

  // thumbnail: mark ready once the ball is mid-flight over the table
  if (PA.THUMB && !window.__ready) { readyT = readyT || t; const el = t - readyT; if ((el > 2 && S.phase === "rally" && ball.p.z > -0.9 && ball.p.z < 0.2 && ball.v.z < 0) || el > 8) window.__ready = true; }
}

/* ------------------------------------------------------------ boot */
if (PA.params.has("auto")) window.__pd = () => ({ ...S, cpuPlan: S.cpuPlan, ball: ball.p.toArray().map((v) => +v.toFixed(2)), v: ball.v.toArray().map((v) => +v.toFixed(2)), pad: pPad.position.toArray(), cpu: cpuPos.toArray() });
setScore();
if (PA.THUMB) { S.mode = "demo"; S.you = 3; S.cpu = 2; setScore(); setupServe(); game.resume(); }
else { S.mode = "menu"; setupServe(); setHint(""); startMenu(); }
</script></body></html>
