<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Little Furrow — Pixel Acre Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Instrument+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="common.css">
<style>
  /* ---------- HUD ---------- */
  .hud { position: fixed; z-index: 18; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud[hidden] { display: none !important; }
  .panel {
    background: color-mix(in srgb, var(--night) 78%, transparent);
    border: 1px solid color-mix(in srgb, var(--mist) 14%, transparent);
    border-radius: 14px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
  #clock { left: max(14px, env(safe-area-inset-left, 0px)); top: calc(58px + env(safe-area-inset-top, 0px)); }
  #clock .panel { padding: 10px 14px 11px; min-width: 168px; }
  .c-row { display: flex; align-items: center; gap: 8px; font: 600 12px/1 var(--font-body); color: var(--mist-dim); }
  .season { font: 400 11px/1 var(--font-pixel); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; color: #1d1530; background: var(--season, var(--sprout)); }
  .c-time { font: 400 26px/1 var(--font-pixel); color: var(--mist); margin: 7px 0 6px; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .c-wx { display: inline-flex; align-items: center; gap: 6px; }
  .c-wx svg { width: 16px; height: 16px; }
  .daybar { height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--mist) 12%, transparent); overflow: hidden; margin-top: 8px; }
  .daybar i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, var(--marigold), var(--rose)); transition: transform .4s linear; }

  #meters { right: max(14px, env(safe-area-inset-right, 0px)); top: calc(58px + env(safe-area-inset-top, 0px)); }
  #meters .panel { padding: 10px 12px; width: 172px; display: grid; gap: 9px; }
  .meter { display: grid; grid-template-columns: 52px 1fr 30px; align-items: center; gap: 8px; font: 600 12px/1 var(--font-body); color: var(--mist-dim); }
  .meter b { font: 400 12px/1 var(--font-pixel); color: var(--mist); text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 9px; border-radius: 6px; background: color-mix(in srgb, var(--mist) 12%, transparent); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; border-radius: inherit; transform-origin: left; transition: transform .3s var(--ease-out), background .3s; }
  #energyFill { background: var(--sprout); }
  #waterFill { background: var(--sky); }
  .meter.low #energyFill { background: var(--rose); }
  .meter.low { animation: lowpulse 1s ease-in-out infinite; }
  @keyframes lowpulse { 50% { opacity: .55; } }

  /* hotbar */
  #dock { left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: flex-end; }
  body.touch #dock { bottom: calc(176px + env(safe-area-inset-bottom, 0px)); }
  .hotbar { display: flex; gap: 6px; padding: 6px; }
  .slot {
    position: relative; width: 58px; height: 58px; border-radius: 11px; border: 0; cursor: pointer;
    background: color-mix(in srgb, var(--dusk) 92%, transparent); color: var(--mist);
    display: grid; place-items: center;
    box-shadow: inset 0 0 0 1px var(--dusk-2);
    transition: transform .14s var(--ease-out), box-shadow .14s, background .14s;
  }
  .slot svg, .slot img { width: 34px; height: 34px; image-rendering: pixelated; }
  .slot .k { position: absolute; top: 4px; left: 6px; font: 400 10px/1 var(--font-pixel); color: var(--mist-dim); }
  .slot .n { position: absolute; bottom: 3px; right: 5px; font: 400 11px/1 var(--font-pixel); color: var(--mist); font-variant-numeric: tabular-nums; }
  .slot:hover { background: var(--dusk-2); }
  .slot:active { transform: translateY(-2px) scale(.94); }
  .slot[aria-pressed="true"] { transform: translateY(-5px); box-shadow: inset 0 0 0 2px var(--marigold), 0 6px 14px rgba(0,0,0,.35); background: color-mix(in srgb, var(--marigold) 18%, var(--dusk)); }
  .slot:focus-visible { outline: 2px solid var(--marigold); outline-offset: 2px; }
  .side { display: flex; flex-direction: column; gap: 6px; padding: 6px; }
  .side .pa-chip { height: 30px; font-size: 12px; padding: 0 12px; justify-content: center; }
  .slotlabel { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); white-space: nowrap; font: 400 12px/1 var(--font-pixel); color: var(--mist); background: var(--night); padding: 5px 8px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .hotbar:hover .slotlabel.show, .slotlabel.flash { opacity: 1; }

  #prompt {
    left: 50%; transform: translateX(-50%); bottom: calc(102px + env(safe-area-inset-bottom, 0px));
    font: 400 13px/1 var(--font-pixel); color: var(--mist); padding: 8px 12px; border-radius: 9px;
    background: color-mix(in srgb, var(--night) 82%, transparent); white-space: nowrap; transition: opacity .2s;
  }
  body.touch #prompt { bottom: calc(262px + env(safe-area-inset-bottom, 0px)); }
  #prompt kbd { font: inherit; color: #2a1606; background: var(--marigold); padding: 2px 6px; border-radius: 4px; margin-right: 6px; }
  #hintbar {
    left: 50%; transform: translateX(-50%); top: calc(58px + env(safe-area-inset-top, 0px));
    max-width: min(520px, calc(100vw - 400px)); text-align: center;
    font: 600 13px/1.35 var(--font-body); color: var(--mist); padding: 9px 14px; border-radius: 12px;
    background: color-mix(in srgb, var(--dusk) 86%, transparent); border: 1px dashed color-mix(in srgb, var(--marigold) 55%, transparent);
  }
  @media (max-width: 760px) {
    #hintbar { top: auto; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 32px); font-size: 12px; }
    body.touch #hintbar { bottom: auto; top: calc(150px + env(safe-area-inset-top, 0px)); }
    #clock .panel { min-width: 0; padding: 8px 10px; }
    .c-time { font-size: 20px; }
    #meters .panel { width: 140px; }
    .meter { grid-template-columns: 44px 1fr 26px; }
    .slot { width: 42px; height: 46px; border-radius: 9px; }
    .slot svg, .slot img { width: 26px; height: 26px; }
    .hotbar { gap: 4px; padding: 5px; }
    #dock { gap: 6px; }
    .side { padding: 5px; gap: 5px; }
    .side .pa-chip { height: 28px; font-size: 11px; padding: 0 9px; }
    .pa-title { display: none; }
  }

  /* floating feedback */
  .float { position: fixed; z-index: 17; pointer-events: none; font: 400 14px/1 var(--font-pixel); color: var(--mist); text-shadow: 0 2px 0 rgba(0,0,0,.5); white-space: nowrap; animation: floatup 1.1s var(--ease-out) forwards; }
  .float.gold { color: var(--marigold); }
  .float.bad { color: var(--rose); }
  @keyframes floatup { from { transform: translate(-50%, 0); opacity: 1; } 70% { opacity: 1; } to { transform: translate(-50%, -46px); opacity: 0; } }

  /* dialogue */
  #dialog { left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(640px, calc(100vw - 32px)); z-index: 32; }
  #dialog .panel { padding: 16px 18px 14px; display: grid; grid-template-columns: 64px 1fr; gap: 14px; background: color-mix(in srgb, var(--dusk) 96%, transparent); animation: pa-pop .3s var(--spring); }
  .portrait { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; overflow: hidden; background: var(--pc, var(--rose)); }
  .portrait canvas { width: 64px; height: 64px; image-rendering: pixelated; }
  .d-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .d-name { font: 400 18px/1 var(--font-display); }
  .d-role { font: 600 12px/1 var(--font-body); color: var(--mist-dim); }
  .hearts { margin-left: auto; font: 400 13px/1 var(--font-pixel); color: var(--rose); letter-spacing: 1px; }
  .hearts span { color: color-mix(in srgb, var(--mist) 25%, transparent); }
  .d-text { margin: 8px 0 12px; font: 500 16px/1.45 var(--font-body); min-height: 46px; }
  .d-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .d-opts .pa-btn { min-height: 38px; padding: 0 14px; font-size: 14px; }
  .voice { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-left: 6px; }
  .voice i { width: 3px; height: 12px; background: var(--marigold); border-radius: 2px; transform-origin: bottom; animation: vbar .5s ease-in-out infinite alternate; }
  .voice i:nth-child(2) { animation-delay: .15s } .voice i:nth-child(3) { animation-delay: .3s }
  @keyframes vbar { from { transform: scaleY(.25) } to { transform: scaleY(1) } }

  /* lists in menus */
  .list { display: grid; gap: 8px; margin: 12px 0 18px; max-height: min(52vh, 420px); overflow: auto; padding-right: 4px; }
  .row { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 12px; background: var(--night); }
  .row img { width: 32px; height: 32px; image-rendering: pixelated; }
  .row .t { font: 600 14px/1.25 var(--font-body); min-width: 0; }
  .row .t small { display: block; font-weight: 400; color: var(--mist-dim); font-size: 12px; margin-top: 2px; }
  .row .pa-btn { min-height: 34px; padding: 0 12px; font-size: 13px; }
  .row .pa-btn[disabled] { opacity: .4; cursor: not-allowed; filter: grayscale(.5); }
  .row.done { opacity: .6; }
  .check { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--dusk-2); font: 700 13px/1 var(--font-body); justify-self: center; }
  .row.done .check { background: var(--sprout); color: #123; }
  .prog { font: 400 12px/1 var(--font-pixel); color: var(--mist-dim); font-variant-numeric: tabular-nums; }
  .money { font: 400 14px/1 var(--font-pixel); color: var(--marigold); }
  .sum { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; margin: 12px 0 16px; font-size: 14px; }
  .sum b { font: 400 14px/1.2 var(--font-pixel); text-align: right; font-variant-numeric: tabular-nums; }
  .sum .tot { border-top: 1px solid var(--dusk-2); padding-top: 8px; font-weight: 700; }
  .pa-toast { top: calc(118px + env(safe-area-inset-top, 0px)); }
  /* zone banner */
  #zone {
    left: 50%; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
    font: 400 17px/1 var(--font-display); letter-spacing: .03em; color: var(--mist); padding: 9px 18px 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--night) 72%, transparent); border: 1px solid color-mix(in srgb, var(--marigold) 45%, transparent);
    transition: opacity .45s ease, transform .45s var(--ease-out);
  }
  #zone.show { opacity: 1; transform: translate(-50%, 0); }
  body.touch #zone { bottom: calc(310px + env(safe-area-inset-bottom, 0px)); }
  .row small .short { color: var(--rose); }
  @media (prefers-reduced-motion: reduce) { #zone { transition: opacity .2s; transform: translate(-50%, 0); } }
  #fade { position: fixed; inset: 0; z-index: 35; background: #0b0816; opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  #fade.on { opacity: 1; }
</style>
<script type="importmap">{"imports":{"three":"../lib/three.module.min.js","three/addons/":"../lib/addons/"}}</script>
</head>
<body>
  <div class="hud" id="clock" hidden>
    <div class="panel">
      <div class="c-row"><span class="season" id="cSeason">Spring</span><span id="cDay">Day 1 · Mon</span></div>
      <div class="c-time" id="cTime">6:00 AM</div>
      <div class="c-row c-wx" id="cWx"></div>
      <div class="daybar"><i id="cDayFill"></i></div>
    </div>
  </div>
  <div class="hud" id="meters" hidden>
    <div class="panel">
      <div class="meter" id="energyMeter"><span>Energy</span><div class="bar"><i id="energyFill"></i></div><b id="energyVal">100</b></div>
      <div class="meter"><span>Can</span><div class="bar"><i id="waterFill"></i></div><b id="waterVal">20</b></div>
    </div>
  </div>
  <div class="hud" id="hintbar" hidden></div>
  <div class="hud" id="prompt" hidden></div>
  <div class="hud" id="dock" hidden>
    <div class="panel hotbar" id="hotbar" role="toolbar" aria-label="Tools"></div>
    <div class="panel side">
      <button class="pa-chip" id="bagBtn">Bag</button>
      <button class="pa-chip" id="journalBtn">Journal</button>
    </div>
  </div>
  <div class="hud" id="dialog" hidden></div>
  <div class="hud" id="zone" aria-live="polite"></div>
  <div id="fade"></div>
  <script type="module" src="farm.js"></script>
</body>
</html>
