<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rooftop Dash — Pixel Acre Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Instrument+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="common.css">
<script type="importmap">{"imports":{"three":"../lib/three.module.min.js"}}</script>
<style>
  a.pa-btn { display: inline-flex; align-items: center; text-decoration: none; }
  .hud { position: fixed; z-index: 18; left: max(14px, env(safe-area-inset-left, 0px)); top: calc(58px + env(safe-area-inset-top, 0px));
    display: flex; gap: 8px; pointer-events: none; }
  .hud span { font: 400 13px/1 var(--font-pixel); color: var(--mist-dim); padding: 7px 10px; border-radius: 999px;
    background: color-mix(in srgb, var(--night) 65%, transparent); border: 1px solid color-mix(in srgb, var(--mist) 12%, transparent); }
  .hud b { color: var(--marigold); font-weight: 400; }
  .say { position: fixed; z-index: 22; left: 50%; top: 24%; transform: translate(-50%, 10px) scale(.9); opacity: 0;
    text-align: center; pointer-events: none; transition: opacity .2s, transform .35s var(--spring); }
  .say.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .say b { display: block; font: 400 clamp(32px, 9vw, 52px)/1 var(--font-display); color: var(--marigold);
    text-shadow: 0 3px 0 #2a1606, 0 0 28px rgba(244,166,58,.45); }
  .say small { display: block; margin-top: 8px; font: 400 15px/1 var(--font-pixel); color: var(--mist); opacity: .85; }
  .trick { position: fixed; z-index: 21; left: 50%; bottom: 22%; transform: translate(-50%, 12px) scale(.85); opacity: 0; pointer-events: none;
    font: 400 clamp(18px, 4.6vw, 26px)/1 var(--font-display); color: #fff3e0; letter-spacing: .04em; text-transform: uppercase;
    text-shadow: 0 2px 0 #2a1606, 0 0 18px rgba(255,61,184,.55); transition: opacity .15s, transform .3s var(--spring); }
  .trick b { color: var(--marigold); font-weight: 400; }
  .trick.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .flash { position: fixed; inset: 0; z-index: 5; background: #dfe6ff; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
  .pa-tbtns.left { left: max(22px, env(safe-area-inset-left, 0px)); right: auto; }
  .pa-card .sub { font: 400 13px/1 var(--font-pixel); color: var(--mist-dim); margin-bottom: 16px; }
  @media (max-width: 420px) {
    .pa-keys { font-size: 13px; gap: 7px 10px; } .pa-card { padding: 22px 18px 18px; }
    .pa-bar .pa-title { display: none; } .pa-chip { white-space: nowrap; padding: 0 11px; }
  }
</style>
</head><body>
<div class="flash" id="flash"></div>
<div class="say" id="say"><b></b><small></small></div>
<div class="trick" id="trick"></div>
<script type="module" src="rooftop/main.js"></script>
</body></html>
