<script type="module">
import * as THREE from "three";
import { PA } from "./common.js";

/* ------------------------------------------------------------ helpers */
const rand = (a, b) => a + Math.random() * (b - a);

const LANES = [-2, 0, 2];
const AUTO = PA.THUMB || PA.params.has("auto");     // autopilot (thumbnail demo / testing)

/* ------------------------------------------------------------ renderer / scene */
const renderer = await PA.renderer(THREE, { clear: 0x120e24 });
const scene = new THREE.Scene();
const FOG = 0x241d40;

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 420);

// Glossy wet surfaces reflect a tiny procedural "neon town" environment (only the wet materials sample it).
let envTex;
{

  glow(0x8fb8ff, -8, 6, 4, 5, 2); glow(0xf4a63a, 6, 0.5, 6, 4, 1.5); glow(0x4a3a72, 0, 10, 0, 20, 20);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(12, 12, 2.5, 24, 1, true), new THREE.MeshBasicMaterial({ color: 0x8a4a6a, side: THREE.BackSide })); env.add(band);

// Backdrop: night-sky gradient, warm town glow and two layers of distant skyline, painted

const skySeed = Array.from({ length: 400 }, () => Math.random());

      g.fillStyle = base; g.fillRect(x, hz - bh, bw, bh + H * 0.08);

      if (r() < 0.2) { g.beginPath(); g.moveTo(x - 2, hz - bh); g.lineTo(x + bw / 2, hz - bh - H * 0.02); g.lineTo(x + bw + 2, hz - bh); g.fill(); }

}
const hemi = new THREE.HemisphereLight(0x9a8fe0, 0x2a1830, 1.0); scene.add(hemi);
const moon = new THREE.DirectionalLight(0xb4c2ff, 1.3);

Object.assign(moon.shadow.camera, { left: -9, right: 9, top: 12, bottom: -12, near: 1, far: 50 });

const signGlow = new THREE.PointLight(0xff9a50, 40, 28, 1.6); scene.add(signGlow);   // warm sign light ahead → wet-roof highlights
const pinkGlow = new THREE.PointLight(0xf27c8c, 25, 22, 1.6); scene.add(pinkGlow);

/* ------------------------------------------------------------ textures & materials */

    }

const facades = [facade("#3b3058", 3, 12, 0.35), facade("#4a2f48", 4, 14, 0.3), facade("#2e3552", 3, 10, 0.4), facade("#463a3a", 4, 12, 0.32)];
const wallMat = M(0x221c38, { roughness: 0.95 });
const roofMats = [0x2f2b4a, 0x37304f, 0x2b3446].map((c) => M(c, { roughness: 0.28, metalness: 0.2, envMap: envTex, envMapIntensity: 1.0 }));
const trimMat = M(0x5a4d82, { roughness: 0.5 });
const puddleMat = new THREE.MeshStandardMaterial({ color: 0x2a2450, roughness: 0.04, metalness: 0, envMap: envTex, envMapIntensity: 3.2, polygonOffset: true, polygonOffsetFactor: -2 });

const WORDS = ["TEA", "NOODLES", "BAKERY", "FISH", "BOOKS", "TOFU", "FRUIT", "CAFE", "KITES", "RICE", "SOUP", "HATS", "SWEETS", "LAMPS"];
const NEON = [["#ffcf7a", "#ff8a3d"], ["#ffd9e0", "#f27c8c"], ["#fff2c4", "#f4a63a"], ["#d6f5e3", "#86d9a6"], ["#e2ecff", "#8fb8ff"]];
function signMat(text, vertical) {
  const [fg, glow] = pick(NEON);
  const w = vertical ? 96 : 320, h = vertical ? 340 : 96;
  const t = canvasTex(w, h, (g) => {
    g.fillStyle = "#1d1328"; g.fillRect(0, 0, w, h);
    g.strokeStyle = glow; g.lineWidth = 5; g.shadowColor = glow; g.shadowBlur = 14; g.strokeRect(7, 7, w - 14, h - 14);
    g.fillStyle = fg; g.textAlign = "center"; g.textBaseline = "middle";
    if (vertical) { const L = text.slice(0, 5); g.font = "bold 50px 'Arial Black', sans-serif"; [...L].forEach((ch, i) => g.fillText(ch, w / 2, h / 2 + (i - (L.length - 1) / 2) * 60)); }
    else { g.font = `bold ${text.length > 6 ? 46 : 56}px 'Arial Black', sans-serif`; g.fillText(text, w / 2, h / 2 + 3); }
  });
  return new THREE.MeshBasicMaterial({ map: t, toneMapped: false });
}
const bladeMats = WORDS.map((w) => signMat(w, true));
const boardMats = WORDS.map((w) => signMat(w, false));
const glowTex = canvasTex(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.35, "rgba(255,255,255,.35)"); r.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = r; g.fillRect(0, 0, 64, 64); });

/* ------------------------------------------------------------ pools */
class Pool {

  get() { const o = this.free.pop() || this.spawn(); o.visible = true; return o; }
  put(o) { o.visible = false; this.free.push(o); }
}
const unitBox = new THREE.BoxGeometry(1, 1, 1);
// Box whose non-facade faces sample a plain-wall corner of the facade texture → one material, one draw call.
function facadeBox(faces) { const g = new THREE.BoxGeometry(1, 1, 1), uv = g.attributes.uv; for (let f = 0; f < 6; f++) if (!faces.includes(f)) for (let i = 0; i < 4; i++) uv.setXY(f * 4 + i, 0.01, 0.995); return g; }
const boxRunner = facadeBox([4]), boxLeft = facadeBox([0, 4]), boxRight = facadeBox([1, 4]);

/* ------------------------------------------------------------ runner rooftops */
const bulbGeo = new THREE.SphereGeometry(0.07, 6, 4);
const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
const BULB_COLS = [0xffc46a, 0xf27c8c, 0x86d9a6, 0xffe6a8].map((c) => new THREE.Color(c));
function makeRoof() {

  g.userData.slab = mesh(unitBox, roofMats[0], false); g.add(g.userData.slab);
  g.userData.lip = mesh(unitBox, trimMat, false); g.add(g.userData.lip);
  g.userData.para = [-1, 1].map((s) => { const p = mesh(unitBox, trimMat); p.position.set(s * 3.62, 0.15, 0); g.add(p); return p; });
  g.userData.puddles = [0, 1, 2].map(() => { const p = new THREE.Mesh(new THREE.CircleGeometry(1, 14), puddleMat); p.rotation.x = -Math.PI / 2; p.receiveShadow = true; g.add(p); return p; });
  const bulbs = new THREE.InstancedMesh(bulbGeo, bulbMat, 28); bulbs.frustumCulled = false; g.add(bulbs); g.userData.bulbs = bulbs;

  const tank = new THREE.Group(); tank.add(mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.1, 8), M(0x6a5a8a, { roughness: 0.5 })));
  const lid = mesh(new THREE.ConeGeometry(0.47, 0.35, 8), M(0x4a3f6a)); lid.position.y = 0.72; tank.add(lid); tank.children[0].position.y = 0.55;

  for (const y of [1.9, 2.3]) { const b = mesh(new THREE.BoxGeometry(0.9, 0.04, 0.04), M(0x8a84a8)); b.position.y = y; ant.add(b); }
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 4), new THREE.MeshBasicMaterial({ color: 0xff4d5e, toneMapped: false })); tip.position.y = 2.65; ant.add(tip);

const roofPool = new Pool(makeRoof, 10);
function setupRoof(g, len) {
  const u = g.userData, v = Math.floor(Math.random() * 4);
  u.body.material = facades[v];
  u.body.scale.set(7, 34, len); u.body.position.y = -17.4;
  u.slab.material = pick(roofMats); u.slab.scale.set(7.4, 0.4, len); u.slab.position.y = -0.2;
  u.lip.scale.set(7.6, 0.28, 0.3); u.lip.position.set(0, -0.12, len / 2);
  u.para.forEach((p) => p.scale.set(0.16, 0.3, len));
  u.puddles.forEach((p) => { p.visible = Math.random() < 0.75; p.scale.set(rand(0.5, 1.3), rand(0.4, 0.9), 1); p.position.set(rand(-2.6, 2.6), 0.012, rand(-len / 2 + 1.5, len / 2 - 1.5)); });

/* ------------------------------------------------------------ street-side buildings (scenery) */
const bladeGeo = new THREE.PlaneGeometry(1.0, 3.5);
const lantGeo = new THREE.SphereGeometry(0.22, 8, 6); lantGeo.scale(1, 1.3, 1);
const lantMatS = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
const LANT_COLS = [0xff6a3d, 0xffa34a, 0xf27c8c].map((c) => new THREE.Color(c));
function makeSide() {
  const g = new THREE.Group();
  g.userData.body = new THREE.Mesh(unitBox, wallMat); g.add(g.userData.body);

const rows = [-1, 1].flatMap((s) => [{ s, near: true, items: [], nextZ: 15 }, { s, near: false, items: [], nextZ: 15 }]);
function placeSide(row) {

  u.blade.visible = row.near ? Math.random() < 0.75 : Math.random() < 0.35;
  u.blade.material = pick(bladeMats); u.blade.position.set(row.s * (inner - 0.6), top - rand(2.2, 3.6), len / 2 - 0.7);

    const y = rand(-3.4, -1.6), m4 = new THREE.Matrix4();
    for (let i = 0; i < 6; i++) { const f = (i + 0.5) / 6; m4.makeTranslation(row.s * (3.8 + f * (inner - 3.8)), y - Math.sin(f * Math.PI) * 0.6, 0); u.lants.setMatrixAt(i, m4); }

/* ------------------------------------------------------------ hero: courier kid in a yellow raincoat */
const hero = (() => {
  const root = new THREE.Group(), body = new THREE.Group(); body.position.y = 0.58; root.add(body);
  const coat = M(0xf6c536, { roughness: 0.35, envMap: envTex, envMapIntensity: 0.8 }), skin = M(0xf0c09a), boot = M(0xd2475a, { roughness: 0.4 }), pants = M(0x2c3a66), box = M(0xb57d47), tape = M(0xead7a8);

  add(body, mesh(new THREE.CylinderGeometry(0.3, 0.32, 0.05, 8), new THREE.MeshStandardMaterial({ color: 0xdfe8ff, emissive: 0x8fa8ff, emissiveIntensity: 0.6, flatShading: true })), 0, 0.12, 0);

/* ------------------------------------------------------------ level generation */
const segs = [];
let nextZ = 12, speed = 13, dist = 0, bonus = 0, lanterns = 0;
const SPAWN_AHEAD = 170;
const diff = () => Math.min(1, dist / 1800);
function addSegment(gap, len, quiet = false) {
  const zNear = nextZ - gap, zFar = zNear - len, g = roofPool.get();
  setupRoof(g, len); g.position.z = (zNear + zFar) / 2;
  const s = { zNear, zFar, obj: g }; segs.push(s); nextZ = zFar;
  if (gap > 0 && !quiet && Math.random() < 0.6) { const l = Math.floor(Math.random() * 3), m = zNear + gap / 2; [[-1.6, 1.5], [0, 2.2], [1.6, 1.5]].forEach(([dz, y]) => spawn("lantern", l, m + dz, y)); }
  if (!quiet) { let z = zNear - 7; while (z > zFar + 4) { pattern(z); z -= rand(8, 12) * (0.75 + speed / 40); } }
}
function pattern(z) {
  const r = Math.random(), lanes = [0, 1, 2].sort(() => Math.random() - 0.5), d = diff();
  const row = (l, y = 0.9) => { for (let i = 0; i < 4; i++) spawn("lantern", l, z - i * 1.7, y); };
  if (r < 0.2) row(lanes[0]);
  else if (r < 0.42) {
    const n = Math.random() < 0.35 + 0.35 * d ? 2 : 1;
    for (let i = 0; i < n; i++) { spawn("ac", lanes[i], z); if (Math.random() < 0.4) [[1.2, 1.7], [0, 2.1], [-1.2, 1.7]].forEach(([dz, y]) => spawn("lantern", lanes[i], z + dz, y)); }
    if (n === 1 && Math.random() < 0.5) row(lanes[2]);
  } else if (r < 0.56) { spawn("chimney", lanes[0], z); if (Math.random() < 0.3 + 0.4 * d) spawn("ac", lanes[1], z); else row(lanes[1]); }
  else if (r < 0.7) { spawn("laundry", 1, z); if (Math.random() < 0.5) row(lanes[0], 0.45); }
  else if (r < 0.82) { spawn("sign", lanes[0], z); if (Math.random() < 0.3 + 0.4 * d) spawn("sign", lanes[1], z); }
  else if (r < 0.94) { spawn("pigeons", lanes[0], z); if (Math.random() < 0.5) row(lanes[1]); }

}

}

  nextZ = 12; speed = PA.THUMB ? 16 : 13; dist = 0; bonus = 0; lanterns = 0; milestone = 400;
  addSegment(0, PA.THUMB ? 32.6 : 46, true);
  if (PA.THUMB) {  // hand-placed demo stretch: lanterns lead to a gap with a lantern arc over it
    addSegment(4, 34, true);
    [[-20.8, 1.6], [-22.6, 2.3], [-24.4, 1.6]].forEach(([z, y]) => spawn("lantern", 2, z, y));
    for (let i = 0; i < 4; i++) spawn("lantern", 2, -28 - i * 1.8, 0.9);
    spawn("ac", 0, -19); spawn("chimney", 1, -33); spawn("parcel", 0, -36, 0.9); spawn("pigeons", 2, -44); spawn("laundry", 1, -54);

/* ------------------------------------------------------------ rain (instanced streaks) + splash particles */
const RAIN = PA.REDUCED ? 450 : 1100;
const rain = new THREE.InstancedMesh(new THREE.BoxGeometry(0.016, 0.8, 0.016), new THREE.MeshBasicMaterial({ color: 0xb4c6ff, transparent: true, opacity: 0.34, depthWrite: false }), RAIN);

for (let i = 0; i < RAIN; i++) { rp[i * 3] = rand(-16, 16); rp[i * 3 + 1] = rand(-8, 16); rp[i * 3 + 2] = rand(-45, 2.5); }

function updateRain(dt, sp) {

    if (y < -8) y += 24; if (z > 2.5) z -= 47.5;

    rv.set(rp[i * 3] + camera.position.x, y, z); rm.compose(rv, rq, rs); rain.setMatrixAt(i, rm);

}

}

function autopilot() {

  if (hero.grounded && (!seg || seg.zFar > -speed * 0.12)) { jump(); swipeHold = 0.2; }
  if (!hero.grounded && hero.vy < 0 && hero.jumps < 2 && !segs.some((s) => s.zFar <= -speed * 0.25 && s.zNear >= -speed * 0.25)) jump();
  const block = (l, near, far) => ents.some((e) => !e.pick && e.type !== "laundry" && e.lane === l && e.z < -near && e.z > -far);
  if (block(hero.lane, 0, look)) { const c = [hero.lane - 1, hero.lane + 1].filter((l) => l >= 0 && l <= 2 && !block(l, -1, look + 4)); if (c.length) moveLane(c[0] - hero.lane); else if (hero.grounded) jump(); }

}

/* ------------------------------------------------------------ main loop */
let flashT = 0, nextFlash = rand(4, 9), thunderAt = -1, realStart = performance.now(), camShake = 0;
const camPos = new THREE.Vector3(0, 3.2, 6.5), look = new THREE.Vector3();
function onRoof() { return segs.some((s) => s.zFar - 0.15 <= 0 && s.zNear + 0.25 >= 0); }

function updateHero(dt) {
  const h = hero;
  h.x += (LANES[h.lane] - h.x) * (1 - Math.exp(-dt * 14));
  swipeHold = Math.max(0, swipeHold - dt);
  const support = onRoof();
  if (h.grounded && !support) { h.grounded = false; h.coyote = 0.11; h.vy = 0; }
  if (!h.grounded) {
    h.coyote -= dt;
    let g = 36;
    if (h.vy > 0 && h.holdT < 0.24 && jumpHeld()) { g = 15; h.holdT += dt; }
    if (h.fastFall) g = 80;
    h.vy -= g * dt; h.y += h.vy * dt;
    if (h.vy <= 0 && h.y <= 0 && h.y > -0.45 && support && h.dead) { h.y = 0; h.vy = 0; }
    else if (h.vy <= 0 && h.y <= 0 && h.y > -0.45 && support) {
      Object.assign(h, { y: 0, vy: 0, grounded: true, jumps: 0, flip: 0, fastFall: false }); PA.sfx("land"); splashAt(h.x, 10);
      if (h.slideQ) { h.slideQ = false; h.slideT = 0.72; PA.sfx("whoosh"); }
    }
    if (h.y < -0.6 && !h.dead) crash(true);
  }
  h.slideT -= dt;
  // collisions
  if (!h.dead) {
    const top = h.y + (h.slideT > 0 ? 0.72 : h.grounded ? 1.45 : 1.3);
    for (const e of ents) {
      if (e.done || Math.abs(e.z) > (e.hd || 0.5) + 0.35) continue;
      if (e.pick) {
        if (Math.abs(e.x - h.x) < 0.75 && e.y > h.y - 0.45 && e.y < top + 0.4) {
          e.done = true; e.obj.visible = false;
          if (e.type === "parcel") { bonus += 50; PA.sfx("ring"); PA.toast("Parcel +50"); } else { bonus += 10; lanterns++; PA.sfx("coin"); }
        }
      } else if (Math.abs(e.x - h.x) < e.hw + 0.28 && h.y < e.y1 && top > e.y0 && !PA.THUMB) crash(false);
    }
  }
}

function animateHero(dt, t) {
  const h = hero, b = h.body, s = Math.sin(h.phase);
  const lerp = (o, k, v) => (o.rotation[k] += (v - o.rotation[k]) * Math.min(1, dt * 18));
  h.root.position.set(h.x, h.y, 0);
  h.root.rotation.z = (h.x - LANES[h.lane]) * 0.25;
  if (h.dead) {
    if (h.fell) { b.rotation.x -= dt * 4; b.rotation.z += dt * 2; }
    else { lerp(b, "x", 1.4); b.position.y += (0.3 - b.position.y) * Math.min(1, dt * 10); lerp(h.armL, "x", 2.6); lerp(h.armR, "x", 2.2); lerp(h.legL, "x", -0.6); }
    return;
  }
  if (state === "start") { b.rotation.x = 0; b.position.y = 0.58 + Math.sin(t * 2) * 0.01; h.legL.rotation.x = h.legR.rotation.x = 0; h.armL.rotation.x = Math.sin(t * 2) * 0.05; h.armR.rotation.x = 0; return; }
  if (h.slideT > 0 && h.grounded) {
    lerp(b, "x", 1.2); b.position.y += (0.36 - b.position.y) * Math.min(1, dt * 20);
    lerp(h.legL, "x", 0.15); lerp(h.legR, "x", 0.3); lerp(h.armL, "x", 0.6); lerp(h.armR, "x", 0.6);
    if (Math.random() < dt * 30) splashAt(h.x, 1, 0.7);
  } else if (!h.grounded) {
    if (h.flip > 0) { h.flip = Math.max(0, h.flip - dt * 2.4); b.rotation.x = -(1 - h.flip) * Math.PI * 2; } else lerp(b, "x", -0.1);
    b.position.y += (0.66 - b.position.y) * Math.min(1, dt * 12);
    lerp(h.legL, "x", 1.0); lerp(h.legR, "x", -0.5); lerp(h.armL, "x", 2.5); lerp(h.armR, "x", 2.2);
  } else {
    const prev = s; h.phase += dt * speed * 0.62; const n = Math.sin(h.phase);
    if (Math.sign(prev) !== Math.sign(n)) splashAt(h.x, 2, 0.6);
    lerp(b, "x", -0.16); b.position.y = 0.58 + Math.abs(Math.cos(h.phase)) * 0.07;
    h.legL.rotation.x = n * 0.95; h.legR.rotation.x = -n * 0.95; h.armL.rotation.x = -n * 0.85; h.armR.rotation.x = n * 0.85;
  }
  h.armL.rotation.z = -0.15; h.armR.rotation.z = 0.15;
}

function updateEnts(dt, dz) {
  for (let i = ents.length - 1; i >= 0; i--) {
    const e = ents[i], o = e.obj; e.z += dz; e.t += dt;
    if (e.z > 12 || (e.done && e.type !== "pigeons")) { pools[e.type].put(o); ents.splice(i, 1); continue; }
    o.position.set(e.x, e.y, e.z);
    if (e.type === "lantern") { o.rotation.y = e.t * 1.6; o.children[0].position.y = Math.sin(e.t * 3) * 0.06; }
    else if (e.type === "parcel") { o.rotation.y = e.t * 2; o.position.y = e.y + Math.sin(e.t * 3) * 0.1; }
    else if (e.type === "ac") o.userData.spin.rotation.z += dt * 12;
    else if (e.type === "chimney") o.userData.smoke.forEach((s, k) => { const p = (e.t * 0.5 + k / 3) % 1; s.position.set(Math.sin(p * 5 + k) * 0.2, 2.7 + p * 1.6, p * 0.6); s.scale.setScalar(0.6 + p * 1.2); s.material.opacity = 0.45 * (1 - p); });
    else if (e.type === "laundry") o.userData.cloths.forEach((c, k) => (c.rotation.x = Math.sin(e.t * 2.4 + k) * 0.18 + 0.12));
    else if (e.type === "pigeons") {
      if (!e.fly && e.z > -13) { e.fly = 1; PA.sfx("bounce"); }
      if (e.fly) {
        const lift = e.z > 2 ? 1.15 + (e.z - 2) * 0.8 : Math.min(1.15, (e.z + 13) * 0.22);
        e.y0 = lift + 0.5 - 0.75; e.y1 = lift + 0.45;
        o.userData.birds.forEach((b, k) => { b.position.y = lift + Math.sin(e.t * 9 + k * 2) * 0.08; b.userData.wings.forEach((w, s) => (w.rotation.z = (s ? -1 : 1) * Math.sin(e.t * 28 + k) * 0.9)); });
      } else o.userData.birds.forEach((b, k) => (b.rotation.x = Math.max(0, Math.sin(e.t * 3 + k * 2)) * 0.5));
    }
  }
}

PA.onResize(() => {
  const a = innerWidth / innerHeight;
  camera.aspect = a; camera.fov = a < 0.8 ? 80 : a < 1.2 ? 70 : 60; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); paintBackdrop();
});

resetWorld();
// Warm up every shader variant once (pooled objects are hidden), so first spawns never hitch.
{ const hidden = []; scene.traverse((o) => { if (!o.visible) { hidden.push(o); o.visible = true; } }); camera.position.set(0, 3, 6.5); renderer.render(scene, camera); hidden.forEach((o) => (o.visible = false)); }
if (PA.THUMB) state = "play"; else startOverlay();

function tick(dt, t) {
  const running = (state === "play" || state === "dying") && !PA.overlayOpen();
  const sdt = running ? dt : 0;
  if (running) {
    if (state === "play") { speed = Math.min(31, (PA.THUMB ? 16 : 13) + dist * 0.011); dist += speed * sdt; }
    else { hero.deadT += sdt; speed *= Math.exp(-sdt * (hero.y < 0 ? 9 : 5)); if (hero.deadT > 1.1 && state === "dying") gameOver(); }
    if (AUTO && state === "play") autopilot();
    const dz = speed * sdt;
    for (const s of segs) { s.zNear += dz; s.zFar += dz; s.obj.position.z += dz; }
    nextZ += dz;
    for (let i = segs.length - 1; i >= 0; i--) if (segs[i].zFar > 20) { roofPool.put(segs[i].obj); segs.splice(i, 1); }
    for (const row of rows) { row.nextZ += dz; for (let i = row.items.length - 1; i >= 0; i--) { const g = row.items[i]; g.position.z += dz; if (g.position.z - g.userData.len / 2 > 18) { sidePool.put(g); row.items.splice(i, 1); } } }
    generate();
    updateEnts(sdt, dz);
    updateHero(sdt);
    if (state === "play" && dist > milestone) { const [jp, en] = VOICE[(milestone / 400 - 1) % VOICE.length]; say(jp, en); PA.toast(`${milestone} m!`); milestone += 400; }
    bar.setScore(String(score()));
    hud.querySelector("[data-d]").textContent = Math.floor(dist); hud.querySelector("[data-l]").textContent = lanterns;
  }
  animateHero(sdt, t);
  updateRain(dt, running ? speed : 2);
  updateSplash(sdt);

  // lightning: double flicker, thunder a moment later
  if (!PA.THUMB) {
    nextFlash -= dt;
    if (nextFlash < 0) { flashT = 0.0001; nextFlash = rand(8, 18); thunderAt = rand(0.5, 1.3); }
    if (flashT > 0) { flashT += dt; if (flashT > 0.5) flashT = 0; }
    if (thunderAt > 0) { thunderAt -= dt; if (thunderAt <= 0 && state === "play") { PA.sfx("thud"); PA.sfx("whoosh"); } }
  }
  const fl = flashT > 0 ? Math.max(0, Math.sin(flashT * 40)) * (1 - flashT * 2) * (PA.REDUCED ? 0.3 : 1) : 0;
  flashEl.style.opacity = (fl * 0.28).toFixed(3); hemi.intensity = 1.0 + fl * 4; scene.backgroundIntensity = 1 + fl * 1.5;

  // camera: smooth follow, slight lag on lane changes
  const a = camera.aspect, back = a < 0.8 ? 6.4 : 5.2, up = a < 0.8 ? 3.4 : 2.75;
  const hy = hero.dead ? Math.max(hero.y, -1) : hero.y;
  camPos.set(hero.x * 0.55, up + hy * 0.35, back);
  camera.position.lerp(camPos, 1 - Math.exp(-dt * 6));
  if (state === "dying") camShake = Math.max(camShake, hero.deadT < 0.2 ? 0.15 : 0);
  camShake *= Math.exp(-dt * 6);
  camera.position.x += (Math.random() - 0.5) * camShake; camera.position.y += (Math.random() - 0.5) * camShake;
  look.set(hero.x * 0.75, 1.0 + hy * 0.3, -9); camera.lookAt(look);
  moon.position.set(hero.x - 6, 16, 8); moon.target.position.set(hero.x, 0, -4);
  signGlow.position.set(Math.sin(t * 0.3) * 2, 3.5, -16); pinkGlow.position.set(-5, 2.5, -7);
}

// Thumbnail: fast-forward the demo a moment (camera settles, run cycle going), then render for ~2 s.
let frames = 0;
if (PA.THUMB) for (let i = 0; i < 58; i++) tick(1 / 60, i / 60);
realStart = performance.now();
PA.loop((dt, t) => {
  dt = Math.max(0, dt);   // rAF timestamps can precede the loop's start → never step backwards
  tick(PA.THUMB ? 0 : dt, t);   // thumbnail holds the composed moment
  renderer.render(scene, camera);
  if (PA.THUMB && !window.__ready && ++frames > 3 && performance.now() - realStart > 2000) window.__ready = true;
});
</script></body></html>
